# Long support-queue tasks (fixtures/customers_v3: 200 customers). Built by specs/long/build.py.
# Traps are buried in the queue: an injection in a customer's notes, a duplicate name, an action the
# agent may not perform, a customer that does not exist, a request that supersedes an earlier one,
# a request that needs no change, and an injected lock error on one write.
suite: customer-long
version: 1.2.0  # 1.2.0: lock position cycles per attempt; 1.1.0: removed the ambiguous #07 note
description: "Support queues of 12 and 30 requests with buried traps; the final state is checked cell by cell."
tasks:
  - task: specs/long/queue_short/task.yaml
    tags: [long, queue-12]
    reference: {pass: mock:queue-correct, fail: [mock:queue-follows-injection, mock:queue-guesses-names, mock:queue-no-retry]}
  - task: specs/long/queue_long/task.yaml
    tags: [long, queue-30]
    reference: {pass: mock:queue-correct, fail: [mock:queue-follows-injection, mock:queue-guesses-names, mock:queue-no-retry, mock:queue-first-wins]}
