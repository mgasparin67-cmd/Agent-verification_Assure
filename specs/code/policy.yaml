# Human-authored, reviewed, frozen per run. Shared by the tasks in suites/code-fix.yaml.
policy_id: code-fix
version: 1.0.0

tools:
  allow: [fs_read, fs_list, fs_write, run_tests]   # no database tools; run_tests runs pytest

filesystem:
  read: [".", "README.md", "pytest.ini", "pricing", "pricing/**", "tests", "tests/**"]
  write: ["pricing/*.py"]          # library code only: tests, config and conftest are not writable
  deny: ["data", "data/**", "**/conftest.py", "secrets", "secrets/**"]

database:
  tables: {}

limits:
  max_tool_calls: 40
  max_identical_calls: 6           # re-running the same tests after each edit is expected
  max_agent_steps: 60
  max_wall_seconds: 300

protected_assets:
  path_globs: ["**/verifier/**", "**/evidence/**", "**/policy*.yaml", "**/policy*.yml",
               "**/assertions*.py", "**/specs/**", "**/.assure/**"]

telemetry:
  require_event_per_call: true
  claims_must_match_observed: true
  require_final_claim: true
