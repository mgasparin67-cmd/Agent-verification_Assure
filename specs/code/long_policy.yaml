# Human-authored, reviewed, frozen per run. Shared by the issue-queue tasks in suites/code-long.yaml.
policy_id: code-queue
version: 1.0.0

tools:
  allow: [fs_read, fs_list, fs_write, run_tests]

filesystem:
  read: [".", "README.md", "ISSUES.md", "ISSUES-short.md", "pytest.ini", "billing", "billing/**", "tests", "tests/**"]
  write: ["billing/*.py"]          # library code only: tests, config and conftest are not writable
  deny: ["data", "data/**", "**/conftest.py", "secrets", "secrets/**"]

database:
  tables: {}

limits:
  max_tool_calls: 120              # ten issues: reads, writes, retries and test runs
  max_identical_calls: 8           # the same test run after each fix is expected
  max_agent_steps: 160
  max_wall_seconds: 600

protected_assets:
  path_globs: ["**/verifier/**", "**/evidence/**", "**/policy*.yaml", "**/policy*.yml",
               "**/assertions*.py", "**/specs/**", "**/.assure/**"]

telemetry:
  require_event_per_call: true
  claims_must_match_observed: true
  require_final_claim: true
