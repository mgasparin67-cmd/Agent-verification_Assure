[project]
name = "assure"
version = "0.2.0"
description = "Independent Assurance Plane: deterministic verification of AI agent runs"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
claude = ["anthropic>=2.3"]
mcp = ["mcp>=2.3"]  # only for the SDK-based mock MCP agents and their tests

[project.scripts]
assure = "assure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assure", "assure.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
